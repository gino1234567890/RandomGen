<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Generatore di numeri a caso</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RandomGen">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<style>
html, body { margin: 0; height: 100%; }
body {
  background: #1a1f33;
  background: -webkit-linear-gradient(top, #262e54, #12162a);
  background: linear-gradient(to bottom, #262e54, #12162a);
  background-attachment: fixed;
  color: #fff;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  text-align: center;
  -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
.wrap { max-width: 520px; margin: 0 auto; padding: 30px 16px 40px; position: relative; }
h1 { font-size: 26px; margin: 0 0 4px; }
.by { font-style: italic; color: #b9bccb; font-size: 15px; margin-bottom: 24px; }
.row { font-size: 20px; margin-bottom: 18px; }
.row input {
  width: 100px; height: 40px; font-size: 20px; text-align: center; margin: 0 6px;
  border: 1px solid #8b90a8; border-radius: 8px; background: #fff; color: #111;
  -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text;
}
.seg { margin-bottom: 20px; }
.seg button {
  width: 130px; height: 38px; font-size: 16px; color: #dfe2f0; cursor: pointer;
  background: #2b3358; border: 1px solid #5a628a; margin: 0 -1px;
}
.seg button:first-child { border-radius: 8px 0 0 8px; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button.on { background: #e6b31a; color: #3a2600; border-color: #e6b31a; font-weight: bold; }
#reels { height: 144px; padding-top: 8px; white-space: nowrap; font-size: 0; }
.reel {
  display: inline-block; vertical-align: top; position: relative; margin: 0 6px;
  box-sizing: content-box; height: 120px; overflow: hidden;
  border: 4px solid #e6b31a; border-radius: 14px; background: #f6f4ea;
  -webkit-transition: box-shadow .3s; transition: box-shadow .3s;
}
.reel.win { box-shadow: 0 0 24px 6px rgba(255, 210, 60, .85); }
.strip { position: absolute; left: 0; top: 0; width: 100%; font-weight: bold; color: #151522; -webkit-transform: translate3d(0,0,0); }
.item { height: 120px; line-height: 120px; text-align: center; overflow: hidden; }
.shade {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none;
  background: -webkit-linear-gradient(top, rgba(0,0,0,.5), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.5));
  background: linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.5));
}
#sum { min-height: 46px; line-height: 46px; margin: 8px 0 14px; font-size: 30px; font-weight: bold; color: #e6b31a; white-space: nowrap; overflow: hidden; }
.go {
  width: 220px; height: 60px; font-size: 25px; font-weight: bold; color: #3a2600; cursor: pointer;
  border: 1px solid #8a5d08; border-radius: 15px;
  background: #e6b31a;
  background: -webkit-linear-gradient(top, #ffe58a, #e6b31a 50%, #b87d0a);
  background: linear-gradient(to bottom, #ffe58a, #e6b31a 50%, #b87d0a);
  box-shadow: 0 3px 0 #6e4a06, 0 6px 12px rgba(0,0,0,.4);
}
.go:active { -webkit-transform: translate(0, 2px); transform: translate(0, 2px); box-shadow: 0 1px 0 #6e4a06; }
button:disabled { opacity: .55; cursor: default; }
.snd { position: absolute; right: 8px; top: 8px; font-size: 28px; background: none; border: 0; color: #fff; padding: 4px; cursor: pointer; }
#dark { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; z-index: 50; opacity: 0; pointer-events: none; -webkit-transition: opacity .8s; transition: opacity .8s; }
#dark.on { opacity: 1; }
#spot { position: absolute; left: 0; top: 0; border-radius: 50%; -webkit-transform: translate3d(-9999px,0,0);
  box-shadow: inset 0 0 50px 28px rgba(0,0,0,.7), 0 0 0 4000px rgba(0,0,0,.96); }
@media (prefers-reduced-motion: reduce) { .reel { -webkit-transition: none; transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <button class="snd" id="snd" aria-label="Audio acceso o spento">🔊</button>
  <h1>Generatore di numeri a caso</h1>
  <div class="by">By Riccardo Sanna &amp; Claude Ai</div>
  <div class="row">Da <input id="from" type="text" value="1"> a <input id="to" type="text" value="100"></div>
  <div class="seg"><button id="m0" class="on">Normale</button><button id="m1">Somma</button></div>
  <div id="reels"></div>
  <div id="sum"></div>
  <button class="go" id="go">Genera</button>
</div>
<div id="dark"><div id="spot"></div></div>
<script>
(function () {
  var H = 120;
  function $(id) { return document.getElementById(id); }
  var raf = window.requestAnimationFrame || window.webkitRequestAnimationFrame ||
            function (f) { return setTimeout(f, 16); };

  /* ---------- Audio (Web Audio API - Senza file esterni) ---------- */
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null, soundOn = true, hum = null;
  function initAudio() {
    if (!AC) return;
    if (!ctx) { try { ctx = new AC(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume();
  }
  function newGain() { return ctx.createGain ? ctx.createGain() : ctx.createGainNode(); }
  function begin(o, t) { if (o.start) o.start(t); else o.noteOn(t); }
  function end(o, t) { if (o.stop) o.stop(t); else o.noteOff(t); }
  function tone(freq, dur, vol, type, delay, freqEnd) {
    if (!soundOn || !ctx) return;
    var t = ctx.currentTime + (delay || 0), o = ctx.createOscillator(), g = newGain();
    try { o.type = type || 'sine'; } catch (e) {}
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    begin(o, t); end(o, t + dur + 0.03);
  }
  function tick(speed) { tone(850 + speed * 750, 0.04, 0.16, 'triangle'); }
  function whoosh() { tone(180, 0.45, 0.09, 'sawtooth', 0, 700); }
  function clunk() { tone(440, 0.3, 0.3, 'sine', 0, 150); }
  
  // Suono spegnimento luci
  function lightsOutSound() {
    tone(280, 0.3, 0.25, 'sawtooth', 0, 70);
  }

  function setType(o, name) {
    try { o.type = name; } catch (e) {}
    if (o.type !== name) { try { o.type = { sine: 0, square: 1, sawtooth: 2, triangle: 3 }[name]; } catch (e2) {} }
  }
  var nb = null;
  function noiseBuf() {
    if (!nb) {
      nb = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      var d = nb.getChannelData(0), i;
      for (i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    return nb;
  }

  // Rullo di tamburi potente
  function snareHit(t, vol) {
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = newGain(), o = ctx.createOscillator(), g2 = newGain();
    s.buffer = noiseBuf();
    try { f.type = 'lowpass'; } catch (e) {}
    if (!f.type) { try { f.type = 0; } catch (e2) {} }
    f.frequency.value = 1100;
    g.gain.setValueAtTime(vol * 1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    s.connect(f); f.connect(g); g.connect(ctx.destination); begin(s, t); end(s, t + 0.09);
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(55, t + 0.07);
    g2.gain.setValueAtTime(vol * 1.4, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.connect(g2); g2.connect(ctx.destination); begin(o, t); end(o, t + 0.09);
  }
  function drumroll(len) {
    if (!soundOn || !ctx) return;
    var t0 = ctx.currentTime + 0.05, t = t0, p;
    while (t < t0 + len) {
      p = (t - t0) / len;
      snareHit(t, 0.1 + 0.38 * p * p);
      t += 0.065 - 0.025 * p;
    }
    snareHit(t0 + len, 0.85);
  }

  function brass(f, t, d, vol) {
    var fl = ctx.createBiquadFilter(), g = newGain(), k, o;
    fl.frequency.setValueAtTime(500, t); fl.frequency.linearRampToValueAtTime(3200, t + 0.07);
    fl.frequency.linearRampToValueAtTime(2000, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.025);
    g.gain.setValueAtTime(vol, t + d - 0.06); g.gain.linearRampToValueAtTime(0.0001, t + d);
    fl.connect(g); g.connect(ctx.destination);
    for (k = 0; k < 2; k++) {
      o = ctx.createOscillator(); setType(o, 'sawtooth');
      o.frequency.value = f * (k ? 1.006 : 1);
      o.connect(fl); begin(o, t); end(o, t + d + 0.02);
    }
  }
  function trumpet() {
    if (!soundOn || !ctx) return;
    var t = ctx.currentTime + 0.05, q = [[392, .13], [523.25, .13], [659.25, .13], [784, .34], [659.25, .13]], i;
    for (i = 0; i < q.length; i++) { brass(q[i][0], t, q[i][1], 0.1); t += q[i][1] + 0.02; }
    brass(784, t, 1.1, 0.1); brass(659.25, t, 1.1, 0.07); brass(523.25, t, 1.1, 0.07);
  }
  function startHum() {
    if (!soundOn || !ctx || hum) return;
    var o = ctx.createOscillator(), g = newGain();
    try { o.type = 'triangle'; } catch (e) {}
    o.frequency.value = 90; g.gain.value = 0.05;
    o.connect(g); g.connect(ctx.destination); begin(o, 0);
    hum = { o: o, g: g };
  }
  function humSpeed(s) { if (hum) hum.o.frequency.value = 80 + s * 260; }
  function stopHum() {
    if (!hum) return;
    try { hum.g.gain.value = 0; end(hum.o, 0); } catch (e) {}
    hum = null;
  }

  /* ---------- Gestione Rulli ---------- */
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function ease(t) { var s = 0.6; t = t - 1; return 1 + (s + 1) * t * t * t + s * t * t; }

  function Reel(w) {
    this.el = document.createElement('div'); this.el.className = 'reel';
    this.el.style.width = w + 'px';
    this.strip = document.createElement('div'); this.strip.className = 'strip';
    var sh = document.createElement('div'); sh.className = 'shade';
    this.el.appendChild(this.strip); this.el.appendChild(sh);
    this.w = w; this.current = '?'; this.setText('?');
  }
  Reel.prototype.setY = function (y) {
    var v = 'translate3d(0,' + (-y) + 'px,0)', s = this.strip.style;
    s.webkitTransform = v; s.transform = v;
  };
  Reel.prototype.setText = function (t) {
    this.current = String(t);
    this.strip.innerHTML = '<div class="item">' + t + '</div>';
    this.setY(0);
  };
  Reel.prototype.fit = function (len) {
    this.strip.style.fontSize = Math.min(64, Math.floor(this.w / (Math.max(1, len) * 0.62))) + 'px';
  };
  Reel.prototype.spin = function (a, b, fakeFin, dur, done) {
    var self = this, n = Math.round(dur / 1000 * 7) + 16, items = [self.current], i, html = '';
    for (i = 1; i < n - 2; i++) items.push(rnd(a, b));
    items.push(fakeFin); items.push(rnd(a, b));
    for (i = 0; i < n; i++) html += '<div class="item" style="color:hsl(' + ((i * 41) % 360) + ',85%,38%)">' + items[i] + '</div>';
    self.strip.innerHTML = html; self.setY(0);
    var target = n - 2, start = Date.now(), lastIdx = 0, lastPos = 0, lastT = start;
    startHum(); whoosh();
    function frame() {
      var now = Date.now(), t = Math.min(1, (now - start) / dur), pos = ease(t) * target;
      self.setY(pos * H);
      var idx = Math.floor(pos + 0.5), dt = Math.max(1, now - lastT);
      var speed = Math.min(1, Math.abs(pos - lastPos) / dt * 1000 / 30);
      if (idx !== lastIdx) { tick(speed); lastIdx = idx; }
      humSpeed(speed);
      var h = (now / 6) % 360;        
      self.el.style.borderColor = 'hsl(' + Math.round(h) + ',100%,55%)';
      self.el.style.boxShadow = '0 0 22px 4px hsl(' + Math.round((h + 60) % 360) + ',100%,60%)';
      self.el.style.background = 'hsl(' + Math.round((h + 180) % 360) + ',100%,93%)';
      lastPos = pos; lastT = now;
      if (t < 1) raf(frame);
      else { 
        stopHum(); 
        self.el.style.borderColor = self.el.style.boxShadow = self.el.style.background = ''; 
        self.setText(fakeFin); 
        self.strip.style.opacity = 0; // Nasconde subito il numero provvisorio
        done(); 
      }
    }
    raf(frame);
  };

  /* ---------- Interfaccia e Scena Finale ---------- */
  var reelsEl = $('reels'), sumEl = $('sum'), goBtn = $('go'), sndBtn = $('snd');
  var fromEl = $('from'), toEl = $('to'), segs = [$('m0'), $('m1')];
  var reels = [], mode = 0, spinning = false;

  function range() {
    var a = parseInt(fromEl.value, 10), b = parseInt(toEl.value, 10), t;
    if (isNaN(a)) a = 1;
    if (isNaN(b)) b = 100;
    if (a > b) { t = a; a = b; b = t; }
    a = Math.max(a, -999999); b = Math.min(b, 999999);
    return [a, b];
  }
  function fitAll() {
    var r = range(), len = Math.max(String(r[0]).length, String(r[1]).length), i;
    for (i = 0; i < reels.length; i++) reels[i].fit(len);
  }
  function buildReels() {
    var count = mode ? 3 : 1, cw = reelsEl.clientWidth || 320, i;
    var w = Math.min(count === 1 ? 220 : 120, Math.floor(cw / count) - 20);
    reelsEl.innerHTML = ''; reels = [];
    for (i = 0; i < count; i++) { var r = new Reel(w); reels.push(r); reelsEl.appendChild(r.el); }
    fitAll();
  }
  function setBusy(b) {
    spinning = b; goBtn.disabled = b; segs[0].disabled = b; segs[1].disabled = b;
    fromEl.disabled = b; toEl.disabled = b;
  }
  function setMode(m) {
    if (spinning) return;
    mode = m; segs[0].className = m ? '' : 'on'; segs[1].className = m ? 'on' : '';
    sumEl.innerHTML = ''; buildReels();
  }
  
  var realFinals = [];

  function finish() {
    var i, sum = 0, parts = [];
    if (realFinals.length > 1) {
      for (i = 0; i < realFinals.length; i++) { sum += realFinals[i]; parts.push(realFinals[i]); }
      sumEl.innerHTML = parts.join(' + ') + ' = ' + sum;
    }
    finale();
  }

  var dark = $('dark'), spot = $('spot');
  function place(x, y, R) {
    var v = 'translate3d(' + Math.round(x - R) + 'px,' + Math.round(y - R) + 'px,0)';
    spot.style.webkitTransform = v; spot.style.transform = v;
  }
  function finale() {
    var a = reels[0].el.getBoundingClientRect(), b = reels[reels.length - 1].el.getBoundingClientRect();
    var W = window.innerWidth || 320, cx = (a.left + b.right) / 2, cy = (a.top + a.bottom) / 2;
    var R = Math.round((b.right - a.left) / 2 + 40), x0 = W + R + 40, i;
    spot.style.width = spot.style.height = (2 * R) + 'px';
    place(x0, cy, R);
    
    // Spegne le luci con il suono, impostando i rulli sul VERO numero finale (diverso da quello di stop)
    lightsOutSound();
    dark.className = 'on';
    for (i = 0; i < reels.length; i++) {
      reels[i].setText(realFinals[i]);
      reels[i].strip.style.opacity = 0;
    }
    sumEl.style.webkitTransition = sumEl.style.transition = 'none';
    sumEl.style.opacity = 0;

    drumroll(6.4);                          // Rullo di tamburi potente

    setTimeout(function () {                // La luce arriva da destra verso sinistra
      var t0 = Date.now();
      (function sweep() {
        var t = Math.min(1, (Date.now() - t0) / 3000), e = 1 - Math.pow(1 - t, 3);
        place(x0 + (cx - x0) * e, cy, R);
        if (t < 1) raf(sweep);
      })();
    }, 900);

    setTimeout(function () {                // Il VERO numero appare e si illumina lentamente alla fine
      var tr = 'opacity 2.6s ease-in', j, s;
      for (j = 0; j < reels.length; j++) {
        s = reels[j].strip.style; s.webkitTransition = tr; s.transition = tr; s.opacity = 1;
      }
      sumEl.style.webkitTransition = tr; sumEl.style.transition = tr; sumEl.style.opacity = 1;
    }, 3900);

    setTimeout(function () {                // Suona la trombetta allegra
      trumpet();
      for (var k = 0; k < reels.length; k++) reels[k].el.className = 'reel win';
    }, 6600);

    setTimeout(function () { dark.className = ''; }, 7800);
    setTimeout(function () {
      for (var m = 0; m < reels.length; m++) {
        reels[m].el.className = 'reel';
        reels[m].strip.style.webkitTransition = reels[m].strip.style.transition = 'none';
      }
      setBusy(false);
    }, 9200);
  }

  function generate() {
    initAudio();
    if (spinning) return;
    var r = range(), a = r[0], b = r[1], i;
    fromEl.value = a; toEl.value = b; fitAll();
    
    // Genera il vero numero finale e un numero fittizio diverso da mostrare prima del buio
    realFinals = [];
    var fakeFinals = [];
    for (i = 0; i < reels.length; i++) {
      var rf = rnd(a, b);
      realFinals.push(rf);
      var ff = rnd(a, b);
      if (b > a && ff === rf) ff = (rf === b ? a : rf + 1); // Assicura che sia diverso
      fakeFinals.push(ff);
    }

    if (mode) for (i = 0; i < reels.length; i++) reels[i].setText('?');
    sumEl.innerHTML = '';
    setBusy(true);
    var dur = mode ? 5000 : 9000;
    
    function run(k) {
      if (k >= reels.length) { finish(); return; }
      reels[k].spin(a, b, fakeFinals[k], dur, function () {
        if (k < reels.length - 1) clunk();
        setTimeout(function () { run(k + 1); }, 350);
      });
    }
    run(0);
  }

  goBtn.onclick = generate;
  segs[0].onclick = function () { setMode(0); };
  segs[1].onclick = function () { setMode(1); };
  fromEl.onkeyup = toEl.onkeyup = fitAll;
  fromEl.onkeydown = toEl.onkeydown = function (e) { if ((e.keyCode || e.which) === 13) { this.blur(); generate(); } };
  sndBtn.onclick = function () {
    initAudio(); soundOn = !soundOn;
    sndBtn.innerHTML = soundOn ? '🔊' : '🔇';
    if (!soundOn) stopHum();
  };
  function onResize() { if (!spinning) buildReels(); }
  window.onresize = onResize;
  window.onorientationchange = function () { setTimeout(onResize, 200); };
  buildReels();
})();
</script>
</body>
</html>
